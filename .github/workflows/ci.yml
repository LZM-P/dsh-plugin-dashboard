name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check index.js
          node --check client.js
          node --check lib/spec.js
      - name: Client build is current
        run: node scripts/build-client.mjs --check
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run types

  # A published package is the only artifact users ever see. Pack it and prove
  # the tarball is loadable on its own: "files" dropping lib/ or locale/ is
  # invisible to the source-tree tests above.
  packaged:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm pack --silent
      - name: Check the packed tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/packed && cd /tmp/packed
          tar -xzf "$GITHUB_WORKSPACE"/*.tgz
          cd package
          for f in index.js client.js lib/spec.js cordis.patch.yml icon.svg LICENSE README.md; do
            test -f "$f" || { echo "missing from tarball: $f"; exit 1; }
          done
          node --check index.js
          node --check client.js
          node -e "
            import('./lib/spec.js').then((s) => {
              if (!s.satisfiesSpec('1.9.0', '^1.2.3')) throw new Error('caret broke');
              if (s.satisfiesSpec('0.3.0', '^0.2.3')) throw new Error('0.x minor lock broke');
              if (!s.satisfiesSpec('1.5.0', '1.2.3 - 2.0.0')) throw new Error('hyphen broke');
              if (!s.satisfiesSpec('3.1.0', '^1.0.0 || ^3.0.0')) throw new Error('union broke');
              if (s.satisfiesSpec('1.9.9', '1.2')) throw new Error('wildcard broke');
              const p = require('./package.json');
              if (!p.version) throw new Error('no version');
              console.log('packed ' + p.name + '@' + p.version + ' loads');
            });
          "
